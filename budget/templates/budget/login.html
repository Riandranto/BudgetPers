{% extends "base.html" %}
{% load static %}

{% block auth_content %}
<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="row w-100">
        <div class="col-md-6 col-lg-4 mx-auto">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="fas fa-coins fa-3x text-success"></i>
                        <h3 class="fw-bold mt-3">Budget Perso</h3>
                        <p class="text-muted">Connectez-vous à votre compte</p>
                    </div>
                    
                    <form method="post">
                        {% csrf_token %}
                        
                        {% if form.errors %}
                        <div class="alert alert-danger">
                            Nom d'utilisateur ou mot de passe incorrect.
                        </div>
                        {% endif %}
                        
                        <div class="mb-3">
                            <label class="form-label">Nom d'utilisateur</label>
                            <input type="text" name="username" class="form-control rounded-pill" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Mot de passe</label>
                            <input type="password" name="password" class="form-control rounded-pill" required>
                        </div>
                        
                        <button type="submit" class="btn btn-success w-100 rounded-pill py-2">
                            <i class="fas fa-sign-in-alt me-2"></i>Se connecter
                        </button>
                    </form>
                    
                    <hr class="my-4">
                    
                    <div class="text-center">
                        <p class="mb-0">Pas encore de compte ? 
                            <a href="{% url 'register' %}" class="text-success">S'inscrire</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
