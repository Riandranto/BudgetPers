{% extends "base.html" %}
{% load static %}

{% block page_title %}Confirmation suppression{% endblock %}

{% block content %}
<div class="container" style="max-width: 500px;">
    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-5 text-center">
            <i class="fas fa-exclamation-triangle fa-4x text-danger mb-3"></i>
            <h4 class="fw-bold mb-3">Confirmer la suppression</h4>
            <p class="text-muted mb-4">
                Êtes-vous sûr de vouloir supprimer la catégorie "{{ category.name }}" ?
                Cette action est irréversible.
            </p>
            
            <form method="post">
                {% csrf_token %}
                <div class="d-flex gap-3">
                    <a href="{% url 'category_list' %}" class="btn btn-outline-secondary rounded-pill flex-grow-1">
                        Annuler
                    </a>
                    <button type="submit" class="btn btn-danger rounded-pill flex-grow-1">
                        <i class="fas fa-trash me-2"></i>Supprimer
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
